name: LedgerFlow checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ADAPTER_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # initdb drops the Administrators SID on Windows. Explicitly allow the
      # runner user on our disposable data only, rather than changing the repo ACL.
      - name: Prepare Windows temporary PostgreSQL permissions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $taskData = Join-Path $env:GITHUB_WORKSPACE '.ledgerflow/tmp'
          New-Item -ItemType Directory -Path $taskData -Force | Out-Null
          $taskSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls $taskData /grant "*${taskSid}:(OI)(CI)F"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: pnpm check
      - run: pnpm evaluate
      - run: pnpm web:build
      - run: pnpm site:prepare
      - run: pnpm gateway:build
      - uses: actions/upload-artifact@v4
        with:
          name: ledgerflow-dashboard-${{ matrix.os }}
          path: apps/web/dist
  container:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the non-root Node image
        run: docker build --tag ledgerflow-ci .
      - name: Verify one foreground MCP product in the built image
        run: docker run --rm --init ledgerflow-ci node --import tsx scripts/container-smoke.ts
